<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scan Kraepelin</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#667085;--ac:#2563eb;--bd:#e2e5ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2027;--tx:#eef1f5;--mut:#9aa4b2;--ac:#5b8cff;--bd:#2c333d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2027;--tx:#eef1f5;--mut:#9aa4b2;--ac:#5b8cff;--bd:#2c333d;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.cam{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3}
video{width:100%;height:100%;object-fit:cover;display:block}
.guide{position:absolute;top:8%;bottom:8%;left:32%;right:32%;border:3px dashed #fff;border-radius:14px}
button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;font-size:17px;font-weight:600;background:var(--ac);color:#fff}
button:disabled{opacity:.55}
.st{text-align:center;font-size:13px;color:var(--mut);margin:10px 0 0;min-height:18px}
.calc{display:flex;flex-direction:column;align-items:center;font:700 64px/1.1 ui-monospace,Menlo,Consolas,monospace}
.calc .ln{width:90px;height:3px;background:var(--tx);margin:6px 0 4px}
.calc .r{color:var(--ac);font-size:80px}
.cap{text-align:center;color:var(--mut);font-size:14px;margin-top:6px}
</style>
</head>
<body>
<main>
<h1>Scan Kraepelin</h1>
<div class="card">
<div class="cam"><video id="v" playsinline muted autoplay></video><div class="guide"></div></div>
<button id="b">Scan dua angka</button>
<p class="st" id="st">Letakkan dua angka (atas dan bawah) di dalam kotak.</p>
</div>
<div class="card">
<div class="calc"><span id="a">–</span><span id="c">–</span><div class="ln"></div><span class="r" id="r">?</span></div>
<p class="cap" id="cap">Hasil akan tampil di sini</p>
</div>
</main>
<script src="tesseract/tesseract.min.js"></script>
<script>
var v=document.getElementById('v'),b=document.getElementById('b'),st=document.getElementById('st'),worker=null,live=false;
function $(i){return document.getElementById(i)}

function cam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){st.textContent='Kamera tidak didukung. Kamera tidak tersedia di perangkat ini.';return Promise.resolve(false)}
  st.textContent='Meminta izin kamera…';
  return navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}).then(function(s){
    v.srcObject=s;live=true;st.textContent='Letakkan dua angka (atas dan bawah) di dalam kotak.';return true;
  }).catch(function(e){
    live=false;b.textContent='Aktifkan kamera';
    st.textContent=(e&&e.name==='NotAllowedError')
      ?'Akses kamera diblokir. Jika halaman ini tampil di dalam pratinjau, buka tautan halaman langsung di tab browser, lalu izinkan kamera dan tekan tombol lagi.'
      :'Kamera tidak ditemukan atau sedang dipakai aplikasi lain. Tutup aplikasi lain lalu tekan tombol lagi.';
    return false;
  });
}

function getWorker(){
  if(worker)return Promise.resolve(worker);
  return Tesseract.createWorker('eng',1,{workerPath:'tesseract/worker.min.js',corePath:'tesseract/core',langPath:'tesseract/lang',workerBlobURL:false})
  .then(function(w){return w.setParameters({tessedit_char_whitelist:'0123456789',tessedit_pageseg_mode:'6'}).then(function(){worker=w;return w})});
}

function crop(){
  var vw=v.videoWidth,vh=v.videoHeight,sx=vw*.32,sy=vh*.08,sw=vw*.36,sh=vh*.84;
  var c=document.createElement('canvas'),k=Math.min(3,900/sh);c.width=sw*k;c.height=sh*k;
  var x=c.getContext('2d');x.drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);
  var d=x.getImageData(0,0,c.width,c.height),p=d.data,s=0,i;
  for(i=0;i<p.length;i+=4){p[i]=p[i+1]=p[i+2]=.3*p[i]+.59*p[i+1]+.11*p[i+2];s+=p[i]}
  var th=s/(p.length/4)*.85;
  for(i=0;i<p.length;i+=4){p[i]=p[i+1]=p[i+2]=p[i]>th?255:0}
  x.putImageData(d,0,0);return c;
}

function scan(){
  b.disabled=true;b.textContent='Membaca…';st.textContent='Membaca angka…';
  getWorker().then(function(w){return w.recognize(crop())}).then(function(r){
    var ds=r.data.text.replace(/\D/g,'').split('').map(Number);
    if(ds.length<2){st.textContent='Dua angka belum terbaca. Dekatkan kamera dan tambah cahaya, lalu coba lagi.';return}
    var a=ds[0],c=ds[1],sum=a+c;
    $('a').textContent=a;$('c').textContent=c;$('r').textContent=sum%10;
    $('cap').textContent=a+' + '+c+' = '+sum+' → ditulis '+(sum%10);
    st.textContent='Selesai. Scan lagi untuk pasangan berikutnya.';
  }).catch(function(){st.textContent='Pembaca angka gagal dimuat.'})
  .then(function(){b.disabled=false;b.textContent='Scan dua angka'});
}

b.onclick=function(){if(!live){cam().then(function(ok){if(ok)b.textContent='Scan dua angka'});return}scan()};
cam().then(function(ok){if(ok)b.textContent='Scan dua angka'});
</script>
</body>
</html>
